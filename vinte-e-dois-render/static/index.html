<!doctype html>
<html lang="pt-BR">
<head>

<title>Vinte e Dois Bet</title>
<meta name="theme-color" content="#0b0e11">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="logo">22<span>BET</span></div>
  <div class="hdr-right">
    <div id="bal" class="chip">—</div>
    <button id="btnCarteira" class="linkbtn">carteira</button>
    <button id="btnSair" class="linkbtn hide">sair</button>
  </div>

<nav id="tabs">
