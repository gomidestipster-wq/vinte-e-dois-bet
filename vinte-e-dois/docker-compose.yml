services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      APP_SECRET: ${APP_SECRET:-vd22-troque-em-producao}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-222222}
      FX_USDT_BRL: ${FX_USDT_BRL:-6.0}
      USDT_ADDRESS: ${USDT_ADDRESS:-}
      OPENPIX_APP_ID: ${OPENPIX_APP_ID:-}
      OPENPIX_CREDENTIALS: ${OPENPIX_CREDENTIALS:-}
      OPENPIX_BASE: ${OPENPIX_BASE:-https://api.openpix.com.br}
    restart: unless-stopped
